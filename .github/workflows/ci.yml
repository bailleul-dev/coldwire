name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Each module is tested on its own, without the workspace, so that
        # go.work cannot hide a dependency missing from a go.mod.
        module: [., example, coldwirevet]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=3 ./...

      - name: benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime 1x ./...

  coldwirevet:
    # The analyzer checks this repository's own code.
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build coldwirevet
        working-directory: coldwirevet
        run: go build -o "$RUNNER_TEMP/coldwirevet" ./cmd/coldwirevet
      - name: library
        run: go vet -vettool="$RUNNER_TEMP/coldwirevet" ./...
      - name: example
        working-directory: example
        run: go vet -vettool="$RUNNER_TEMP/coldwirevet" ./...
